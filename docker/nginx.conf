server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # Même limite que post_max_size dans docker/php.ini.
    client_max_body_size 12M;

    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Les assets compilés par Vite ont un nom qui change à chaque build : on peut les garder longtemps.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Polices (Montserrat, servie en local) et images (emblème, icônes) : noms fixes, gardées un mois.
    location ~ ^/(fonts|images)/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # PHP est exécuté par le conteneur app (PHP-FPM, port 9000 sur le réseau interne).
    # Le script de Livewire (/livewire/livewire.js) passe aussi par PHP.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 70;
        fastcgi_hide_header X-Powered-By;
    }

    # Aucun autre fichier PHP n'est exécutable, et les fichiers cachés (.env, .git) ne sont jamais servis.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
}
