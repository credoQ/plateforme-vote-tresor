; Réglages PHP de la plateforme, ajoutés à php.ini-production.

; Aucun fichier n'est téléversé par les écrans (les agents s'importent en ligne de commande) :
; les limites restent modestes. 256 Mo couvrent la génération des procès-verbaux PDF.
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 60

expose_php = Off
; Laravel travaille en UTC (config/app.php) et affiche l'heure du Bénin : ce réglage ne sert qu'aux journaux de PHP.
date.timezone = Africa/Porto-Novo

; Le code ne change pas tant que l'image n'est pas reconstruite : inutile de revérifier les fichiers.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16

; Garde en mémoire les chemins des fichiers PHP pour ne pas les rechercher à chaque requête.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Cookies de session : jamais lisibles en JavaScript.
session.cookie_httponly = 1
