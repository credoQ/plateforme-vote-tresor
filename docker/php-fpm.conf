; Pool PHP-FPM du conteneur app, chargé après la configuration de l'image.
; L'image limite à 5 requêtes PHP simultanées : trop peu à l'ouverture d'un scrutin, avec Livewire.
[www]
pm = dynamic
; Compter environ 50 Mo par processus : à ajuster à la RAM du serveur (PHP_FPM_MAX_CHILDREN dans le .env).
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
; Recycle les processus pour rendre la mémoire gardée après la génération d'un PDF.
pm.max_requests = 500
; Une requête bloquée plus de 60 s est arrêtée, pour ne pas occuper un processus indéfiniment.
request_terminate_timeout = 65s
